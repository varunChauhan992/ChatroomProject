<style>
  :root {

    --button-yellow: #fde047;

    --placeholder-color: #888888;
  }

    color: var(--text-color);

  body {

    min-height: 100vh;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  .auth-card {
    background-color: var(--card-bg);
    border: 2.5px solid var(--border-color);
    border-radius: 16px;
    box-shadow: 6px 6px 0px var(--border-color);
    width: 100%;
    max-width: 520px;
    padding: 2.5rem;
    position: relative;
  }

  .card-title {
    font-size: 1.85rem;
    font-weight: 800;
    margin: 0 0 1.5rem 0;
    display: flex;
    align-items: center;
    gap: 0.5rem;
    letter-spacing: -0.02em;
  }

  .auth-form {
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* Django default form paragraph styling override */
  .auth-form p {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }

  .auth-form label {
    font-weight: 700;
    font-size: 0.95rem;
  }

  .auth-form input[type="text"],
  .auth-form input[type="password"] {
    width: 100%;
    padding: 0.85rem 1.1rem;
    border: 2.5px solid var(--border-color);
    border-radius: 24px;
    font-size: 1rem;
    outline: none;
    background-color: #ffffff;
    transition: box-shadow 0.15s ease;
  }

  .auth-form input:focus {
    box-shadow: 2px 2px 0px var(--border-color);
  }

  .helptext {
    font-size: 0.8rem;
    color: #555555;
    margin-top: 0.2rem;
  }

  .errorlist {

    list-style: none;
    padding: 0;
    margin: 0.2rem 0 0 0;
  }

    display: flex;
    justify-content: flex-end;
    margin-top: 0.5rem;
  }

    background-color: var(--button-yellow);
    border: 2.5px solid var(--border-color);

  .btn-submit:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0px var(--border-color);

    margin-top: 1.5rem;
    font-size: 0.9rem;
    font-weight: 600;
