<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap">
<style>
  :root {
    --bg: #f3f5f9;
    --card: #ffffff;
    --border: #dfe3e8;
    --text: #2b2f36;
    --muted: #6b7280;
    --primary: #35618f;
    --primary-dark: #2a4f77;
    --primary-soft: #e8f0f9;
    --danger: #c0392b;
    --danger-soft: #fdecea;
    --success: #1e7e34;
    --success-soft: #e6f4ea;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  /* Only login / signup / create / delete pages are centred */
  body.center-page {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }

  a { color: inherit; }
  input, button { font-family: inherit; }

  /* ---------- Cards ---------- */
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 12px 30px rgba(20, 40, 70, 0.10);
    width: 100%;
    max-width: 360px;
    padding: 2rem 1.75rem 1.5rem;
  }
  .auth-card.wide { max-width: 480px; }

  .avatar {
    display: block;
    width: 114px;
    height: 114px;
    margin: 0 auto 1.6rem;
  }

  .card-title {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0 0 1.25rem;
    text-align: center;
  }

  /* ---------- Forms ---------- */
  .auth-form { display: flex; flex-direction: column; gap: 1rem; }

  .auth-form p {
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .auth-form label { font-size: 0.82rem; color: var(--muted); }
  .auth-form .req { color: var(--muted); }

  .auth-form input[type="text"],
  .auth-form input[type="password"],
  .input {
    width: 100%;
    padding: 0.7rem 0.75rem;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 0.95rem;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .auth-form input::placeholder, .input::placeholder { color: #b5bbc4; }
  .auth-form input:focus, .input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(53, 97, 143, 0.15);
  }

  .show-pass {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.85rem;
    color: var(--muted);
    cursor: pointer;
  }
  .show-pass input { accent-color: var(--primary); }

  .helptext { font-size: 0.75rem; color: var(--muted); }
  .helptext ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }

  .errorlist {
    color: var(--danger);
    font-size: 0.8rem;
    list-style: none;
    padding: 0;
    margin: 0 0 0.2rem;
  }

  .auth-footer {
    margin: 1.25rem 0 0;
    text-align: center;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .auth-footer a { color: var(--primary-dark); text-decoration: underline; }

  /* ---------- Buttons ---------- */
  .btn, .btn-submit {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    background: var(--primary);
    color: #fff;
    border: 1px solid var(--primary);
    border-radius: 3px;
    padding: 0.75rem 1.1rem;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .btn:hover, .btn-submit:hover { background: var(--primary-dark); }
  .btn:active, .btn-submit:active { transform: translateY(1px); }

  .btn-block { width: 100%; }
  .btn-sm { padding: 0.45rem 0.75rem; font-size: 0.72rem; }

  .btn-secondary { background: #fff; color: var(--primary-dark); border-color: var(--border); }
  .btn-secondary:hover { background: var(--primary-soft); }

  .btn-danger { background: var(--danger); border-color: var(--danger); }
  .btn-danger:hover { background: #a93226; }

  .btn-danger-soft { background: #fff; color: var(--danger); border-color: #f0c4be; }
  .btn-danger-soft:hover { background: var(--danger-soft); }

  .btn-row { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
  .btn-row > * { flex: 1; }

  /* ---------- App pages (rooms list, chat) ---------- */
  .app-shell {
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 1.5rem;
  }

  .panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    box-shadow: 0 12px 30px rgba(20, 40, 70, 0.08);
    padding: 1.5rem;
  }

  .dashboard {
    display: grid;
    grid-template-columns: 1fr 280px;
    gap: 1.5rem;
    align-items: start;
  }
  @media (max-width: 800px) { .dashboard { grid-template-columns: 1fr; } }

  .page-title { margin: 0 0 0.25rem; font-size: 1.5rem; }
  .muted { color: var(--muted); font-size: 0.9rem; margin: 0; }

  .flash {
    background: var(--success-soft);
    color: var(--success);
    border: 1px solid #cfe8d5;
    border-radius: 3px;
    padding: 0.65rem 0.85rem;
    margin-top: 1rem;
    font-size: 0.9rem;
  }

  .rooms-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
    margin-top: 1.25rem;
  }

  .room-card {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .room-card:hover {
    border-color: var(--primary);
    box-shadow: 0 6px 16px rgba(20, 40, 70, 0.08);
  }
  .room-card h3 { margin: 0; font-size: 1.05rem; }
  .room-card h3 a { color: var(--primary-dark); text-decoration: none; }
  .room-card h3 a:hover { text-decoration: underline; }
  .room-meta { font-size: 0.82rem; color: var(--muted); }
  .room-actions {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-top: auto;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    background: var(--success-soft);
    color: var(--success);
    border-radius: 999px;
    padding: 0.2rem 0.7rem;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .badge::before {
    content: "";
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--success);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 3rem 1rem;
    margin-top: 1.25rem;
  }

  .side-title {
    margin: 0 0 1rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--border);
    font-size: 1rem;
  }
  .side-menu { display: flex; flex-direction: column; gap: 0.7rem; }
  .side-menu form { margin: 0; }

  /* ---------- Chat room ---------- */
  .chat-panel {
    display: flex;
    flex-direction: column;
    height: calc(100vh - 3rem);
    min-height: 420px;
  }

  .chat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    padding-bottom: 1rem;
    margin-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .chat-header-left { display: flex; align-items: center; gap: 1rem; min-width: 0; }
  .chat-header h2 { margin: 0; font-size: 1.25rem; }

  .chat-log {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    padding: 1rem;
    margin-bottom: 1rem;
    background: #f8f9fc;
    border: 1px solid var(--border);
    border-radius: 4px;
  }

  .chat-message-item {
    align-self: flex-start;
    max-width: min(75%, 640px);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 0.55rem 0.8rem;
    word-break: break-word;
  }
  .chat-message-item.self {
    align-self: flex-end;
    background: var(--primary-soft);
    border-color: #c9daee;
  }
  .chat-message-item .username {
    display: block;
    margin-bottom: 0.15rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--primary-dark);
  }
  .chat-message-item .text { font-size: 0.95rem; }

  .chat-input { display: flex; gap: 0.75rem; }
  .chat-input .input { flex: 1; }
</style>
