<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>#{{ room.name }} - Chatroom</title>
  {% include 'chat/style_inc.html' %}
</head>
<body>

  <div class="app-shell">
    <div class="panel chat-panel">

      <div class="chat-header">
        <div class="chat-header-left">
          <a href="{% url 'rooms_list' %}" class="btn btn-secondary btn-sm">&larr; Rooms</a>
          <div>
            <h2># {{ room.name }}</h2>
            <span class="muted">Admin: {{ room.admin.username }}</span>
          </div>
        </div>
        <span class="badge"><span id="active-count">{{ active_count }}</span>&nbsp;active</span>
      </div>

      <div id="chat-log" class="chat-log">
        {% for m in chat_messages %}
          <div class="chat-message-item{% if m.user == request.user %} self{% endif %}">
            <span class="username">{{ m.user.username }}</span>
            <div class="text">{{ m.content }}</div>
          </div>
        {% endfor %}
      </div>

      <div class="chat-input">
        <input id="chat-message-input" class="input" type="text" placeholder="Type a message..." autocomplete="off">
        <button id="chat-message-submit" class="btn" type="button">Send</button>
      </div>

    </div>
  </div>

  <script>
    const roomSlug = "{{ room.slug }}";
    const currentUsername = "{{ request.user.username }}";

    // Establish WebSocket connection
    const wsScheme = window.location.protocol === "https:" ? "wss" : "ws";
    const chatSocket = new WebSocket(
        wsScheme + '://' + window.location.host + '/ws/chat/' + roomSlug + '/'
    );

    const log = document.querySelector('#chat-log');
    log.scrollTop = log.scrollHeight;

    chatSocket.onmessage = function(e) {
        const data = JSON.parse(e.data);

        if (data.type === 'chat_message') {
            const chatLog = document.querySelector('#chat-log');

            const messageCard = document.createElement('div');
            messageCard.classList.add('chat-message-item');
            if (data.username === currentUsername) {
                messageCard.classList.add('self');
            }

            const u = document.createElement('span');
            u.className = 'username';
            u.textContent = data.username;

            const t = document.createElement('div');
            t.className = 'text';
            t.textContent = data.message;

            messageCard.append(u, t);

            chatLog.appendChild(messageCard);
            chatLog.scrollTop = chatLog.scrollHeight;
        } else if (data.type === 'active_count_update') {
            document.querySelector('#active-count').innerText = data.active_count;
        }
    };

    chatSocket.onclose = function(e) {
        console.error('Chat socket closed unexpectedly');
    };

    document.querySelector('#chat-message-input').focus();
    document.querySelector('#chat-message-input').onkeyup = function(e) {
        if (e.keyCode === 13) {  // Enter key
            document.querySelector('#chat-message-submit').click();
        }
    };

    document.querySelector('#chat-message-submit').onclick = function(e) {
        const messageInputDom = document.querySelector('#chat-message-input');
        const message = messageInputDom.value;
        if (message.trim() !== "") {
            chatSocket.send(JSON.stringify({
                'message': message
            }));
            messageInputDom.value = '';
        }
    };
  </script>

</body>
</html>
