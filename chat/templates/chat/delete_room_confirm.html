<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete Room</title>
  {% include 'chat/style_inc.html' %}
</head>
<body class="center-page">

  <div class="auth-card wide">
    <h2 class="card-title" style="color: var(--danger);">Delete room</h2>

    <p style="text-align: center; line-height: 1.5;">
      Are you sure you want to permanently delete <strong>#{{ room.name }}</strong>?
      This can't be undone and will disconnect everyone in the room.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="btn-row">
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'rooms_list' %}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>

</body>
</html>
