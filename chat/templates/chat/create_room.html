<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Chatroom</title>
  {% include 'chat/style_inc.html' %}
</head>
<body class="center-page">

  <div class="auth-card wide">
    <h2 class="card-title">Create a new chatroom</h2>

    <form method="post" class="auth-form">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn btn-block">Create room</button>
    </form>

    <p class="auth-footer">
      <a href="{% url 'rooms_list' %}">&larr; Back to chatrooms</a>
    </p>
  </div>

</body>
</html>
